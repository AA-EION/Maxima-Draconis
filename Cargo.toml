[workspace]
resolver = "2"
members = [
    "maxima-bootstrap",
    "maxima-cli",
    "maxima-lib",
    "maxima-proto",
    "maxima-server",
    "maxima-service",
    "maxima-tui",
    "maxima-ui",
    "maxima-resources",
]

# Inherited by ship-binary crates via `version.workspace = true`.
# Bumped at every release tag — single source of truth so we don't
# drift again the way maxima-cli / maxima-bootstrap / maxima-service
# / maxima-tui / maxima-ui did between #6 and v0.12.1.
#
# `maxima-lib` and `maxima-resources` opt out (they pin their own
# version on purpose — maxima-lib is a library whose version we
# embed in `FInstall.txt`'s `maxima_lib_version` field, and
# `maxima-resources` is a build-time helper crate).
[workspace.package]
version = "0.16.1"

[profile.release]
strip = true

# Pinned to exact commits (the default-branch heads these tracked when
# pinned) so a push to either fork can't change a build. Bump deliberately.
[patch.crates-io]
flate2 = { git = 'https://github.com/ArmchairDevelopers/flate2-rs.git', rev = '42daaa1eb6aad89d9cf8c1fa51f2d6bcae3a3247' }
async-compression = { git = 'https://github.com/ArmchairDevelopers/async-compression.git', rev = '4c9a88aa0ba50b32400e308b0c0dda9e5bf0e779' }
