name: Maxima Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
    
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maxima
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.experimental }}  
    strategy:
      fail-fast: false
      matrix:
        rust-version: [nightly]
        os: [ubuntu-latest, windows-latest, macos-latest]
        experimental: [false]

    env:
      CARGO_TERM_COLOR: always

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Cache Rust ${{ matrix.rust-version }}
      if: runner.os != 'macOS'
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}\rust\.rustup
        key: rust-${{ matrix.rust-version }}-${{ hashFiles('**/rust-toolchain') }}

    - name: Setup Rust ${{ matrix.rust-version }}
      if: runner.os != 'macOS'
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust-version }}
        override: true
        components: rustfmt, clippy

    - name: Install Protoc
      # Only needed for the Rust build (maxima-lib/prost-build). macOS only
      # builds the Swift helper.
      if: runner.os != 'macOS'
      uses: arduino/setup-protoc@v3
      with:
        # Pass the workflow token so the action's call to GitHub's release API
        # doesn't hit the anonymous rate limit (frequent flake on shared CI IPs).
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Dependencies
      id: install-depends
      if: runner.os == 'Linux'
      run: |
        # X11/xkbcommon libs are only needed by maxima-ui (not built here).
        sudo apt-get install -y musl-tools libdbus-1-dev pkg-config
        rustup target add x86_64-unknown-linux-musl

    - uses: Swatinem/rust-cache@v2
      if: runner.os != 'macOS'
      with:
        shared-key: ${{ runner.os}}-rust-deps
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Build Maxima
      if: runner.os == 'Windows'
      # Windows builds the full workspace — maxima-tui and maxima-ui both
      # compile fine on the Windows target (the rustix 0.37 issue is
      # unix-only, since the offending chain is accesskit_unix → zbus →
      # async-io). NSIS picks them up via `File /nonfatal` so users get
      # a complete install including the (still-WIP) UI.
      run: |
        cargo build --release

    - name: Install NSIS
      if: runner.os == 'Windows'
      run: |
        choco install nsis -y

    - name: Build Installer
      if: runner.os == 'Windows'
      run: |
        $env:PATH += ";C:\Program Files (x86)\NSIS"
        makensis /DBIN_DIR="..\target\release" installer\maxima-setup.nsi

    - uses: actions/upload-artifact@v4
      if: runner.os == 'Windows'
      with:
        name: maxima-x86_64-win64
        path: |
          target/release/maxima-service.exe
          target/release/maxima-bootstrap.exe
          target/release/maxima-cli.exe
          target/release/maxima-server.exe
          target/release/maxima-tui.exe
          target/release/maxima.exe

    - uses: actions/upload-artifact@v4
      if: runner.os == 'Windows'
      with:
        name: maxima-installer-win64
        path: installer/MaximaSetup.exe

    - name: Build Maxima
      if: runner.os == 'Linux'
      # Build the Draconis-relevant crates + the server. maxima-ui pulls
      # accesskit_unix → zbus 3 → async-io 1.13 → rustix 0.37.28, which doesn't
      # build on modern nightly (uses `rustc_attrs`, now a reserved namespace).
      # maxima-service is windows-only. We skip both here.
      run: |
        cargo build --release --target x86_64-unknown-linux-musl \
          -p maxima-cli -p maxima-bootstrap -p maxima-server
      env:
        RUSTFLAGS: "-C target-feature=+crt-static"

    - name: Check Linux SNI tray (feature linux-tray)
      if: runner.os == 'Linux'
      # The optional server status-icon tray (ksni, pure D-Bus). Off by default,
      # so this is the only place it's compiled — checked on the host gnu target
      # (a full cross-static musl build of zbus isn't needed just to typecheck).
      run: |
        cargo check -p maxima-server --features linux-tray

    - name: File Permissions
      if: runner.os == 'Linux'
      run: |
        ls -l target/x86_64-unknown-linux-musl/release
        chmod +x target/x86_64-unknown-linux-musl/release/maxima-bootstrap
        chmod +x target/x86_64-unknown-linux-musl/release/maxima-cli
        chmod +x target/x86_64-unknown-linux-musl/release/maxima-server

    - uses: actions/upload-artifact@v4
      if: runner.os == 'Linux'
      with:
        name: maxima-x86_64-linux-musl
        path: |
          target/x86_64-unknown-linux-musl/release/maxima-bootstrap
          target/x86_64-unknown-linux-musl/release/maxima-cli
          target/x86_64-unknown-linux-musl/release/maxima-server

    # ── macOS: validate MaximaHelper.app build ─────────────────────────────
    # This mirrors what release.yml does so PRs that break the helper get
    # caught before merge, not on the next tag.
    - name: Build MaximaHelper.app
      if: runner.os == 'macOS'
      run: bash MaximaHelper/build.sh --output ./dist --no-register

    - name: Sanity-check helper bundle
      if: runner.os == 'macOS'
      run: |
        set -e
        test -x ./dist/MaximaHelper.app/Contents/MacOS/MaximaHelper
        test -f ./dist/MaximaHelper.app/Contents/Info.plist
        /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" \
          ./dist/MaximaHelper.app/Contents/Info.plist | grep -q "qrc"
        echo "✓ MaximaHelper.app looks healthy"

    # actions/upload-artifact strips the leading path component, so uploading
    # `dist/MaximaHelper.app` directly would flatten Contents/ etc. into the
    # artifact root and lose the `.app` bundle structure. Zip first to preserve
    # it — same approach release.yml uses to produce MaximaHelper.zip.
    - name: Zip MaximaHelper.app
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r --symlinks MaximaHelper.zip MaximaHelper.app

    - uses: actions/upload-artifact@v4
      if: runner.os == 'macOS'
      with:
        name: maxima-helper-zip
        path: dist/MaximaHelper.zip

  # ── Linux arm64 (native) ─────────────────────────────────────────────────
  # Compiles the aarch64 paths of maxima-lib (hardware hash via /proc/cpuinfo
  # and lscpu instead of cpuid) on a real arm64 runner. Same crates as the
  # x86_64 Linux job; glibc target, so no static musl build here.
  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v4

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config

    - name: Install Rust nightly
      # rust-toolchain.toml pins nightly; rustup picks it up on first use.
      run: rustup show active-toolchain || rustup toolchain install nightly --profile minimal

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: Linux-arm64-rust-deps
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Build Maxima
      run: |
        cargo build --release -p maxima-cli -p maxima-bootstrap -p maxima-server

    - name: Unit tests (maxima-lib)
      # read_files/write_files need a live EA session.
      run: cargo test --release -p maxima-lib --lib -- --skip read_files --skip write_files

    - name: Smoke-test the arm64 CLI
      run: |
        set -e
        ./target/release/maxima-cli --help >/dev/null
        test "$(uname -m)" = aarch64

  # ── macOS native (Apple Silicon) ─────────────────────────────────────────
  # The native-mode binaries (maxima-cli / maxima-server / maxima-bootstrap /
  # maxima-tui), MaximaBootstrap.app and the SwiftUI Maxima.app. The matrix
  # job above only builds MaximaHelper on macOS, so without this nothing
  # compiles the `cfg(target_os = "macos")` Rust paths before a release.
  macos-native:
    name: macOS native (arm64)
    runs-on: macos-26
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v4

    - name: Install Protoc
      run: brew install protobuf

    - name: Install Rust nightly
      # rust-toolchain.toml pins nightly; rustup picks it up on first use.
      run: rustup show active-toolchain || rustup toolchain install nightly --profile minimal

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: macOS-native-rust-deps
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Build native binaries
      run: |
        cargo build --release \
          -p maxima-cli -p maxima-server -p maxima-bootstrap -p maxima-tui

    - name: Unit tests (maxima-proto)
      run: cargo test --release -p maxima-proto

    - name: Assemble MaximaBootstrap.app + Maxima.app
      run: |
        bash maxima-bootstrap/build-app.sh
        bash maxima-native/build.sh

    - name: Smoke-test the native CLI
      # No login is available on CI, so only exercise commands that are pure
      # host operations: argument parsing and the server probe.
      run: |
        set -e
        ./target/release/maxima-cli --help >/dev/null
        out="$(./target/release/maxima-cli server-status --json)"
        echo "$out"
        echo "$out" | grep -q '"running":false'
        test -x maxima-native/build/Maxima.app/Contents/MacOS/Maxima
        test -x maxima-native/build/Maxima.app/Contents/Resources/maxima-server
        test -d maxima-native/build/Maxima.app/Contents/Resources/bundle/osx/MaximaBootstrap.app
        codesign --verify --deep maxima-native/build/Maxima.app
        echo "✓ native macOS build looks healthy"

  # ── maxima-ui animated backgrounds (opt-in `bg-videos` feature) ────────────
  # The default build needs no FFmpeg. This job only compiles the feature on
  # macOS so the FFmpeg-backed player (maxima-ui/src/renderers/media_player.rs)
  # can't rot unnoticed. ffmpeg-next tracks the FFmpeg major.minor, so the
  # version pinned in maxima-ui/Cargo.toml (~7.1) is paired with ffmpeg@7,
  # which Homebrew keeps keg-only (hence the PKG_CONFIG_PATH).
  ui-bg-videos:
    name: ui-bg-videos (macOS)
    runs-on: macos-26
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v4

    - name: Install FFmpeg, pkgconf and protoc
      run: brew install ffmpeg@7 pkgconf protobuf

    - name: Install Rust nightly
      run: rustup show active-toolchain || rustup toolchain install nightly --profile minimal

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: macOS-ui-bg-videos-rust-deps
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Check maxima-ui with bg-videos
      run: |
        export PKG_CONFIG_PATH="$(brew --prefix ffmpeg@7)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        cargo check -p maxima-ui --features bg-videos

  # ── MaximaSetup.exe under Wine on macOS ──────────────────────────────────
  # The in-bottle mode Draconis uses: install MaximaSetup.exe into a fresh
  # Wine prefix on a macOS runner, then check the installed layout and that
  # the thin-client CLI really spawns maxima-server.exe. Intel runner so the
  # x86_64 Windows binaries run without Rosetta.
  wine-smoke:
    name: MaximaSetup.exe under Wine (macOS)
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: maxima-installer-win64
        path: dist

    - name: Install Wine
      # Homebrew disabled the wine-* casks on 2026-09-01 (they fail its
      # Gatekeeper check), so take the same Gcenx build the cask used to
      # wrap, pinned. curl sets no quarantine xattr, so it runs as-is.
      env:
        WINE_VERSION: "11.17"
      run: |
        curl -fsSL -o "$RUNNER_TEMP/wine.tar.xz" \
          "https://github.com/Gcenx/macOS_Wine_builds/releases/download/${WINE_VERSION}/wine-devel-${WINE_VERSION}-osx64.tar.xz"
        tar -xJf "$RUNNER_TEMP/wine.tar.xz" -C "$RUNNER_TEMP"
        bin="$(find "$RUNNER_TEMP" -maxdepth 5 -type d -path '*/Contents/Resources/wine/bin' | head -n1)"
        test -n "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/wine" --version

    - name: Install + verify Maxima in a fresh prefix
      env:
        WINEPREFIX: ${{ runner.temp }}/maxima-prefix
        WINEDEBUG: -all
        WINEDLLOVERRIDES: "mscoree,mshtml="
      run: bash installer/wine-smoke.sh dist/MaximaSetup.exe
